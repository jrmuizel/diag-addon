<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --border: #e2e6ea;
    --text: #1c2530;
    --muted: #8a94a0;
    --accent: #2563eb;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --danger: #dc2626;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { height: 100vh; display: flex; flex-direction: column; }

  /* ---------- header / settings ---------- */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 6px 10px;
    flex: 0 0 auto;
  }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .title-row h1 { font-size: 13px; margin: 0; font-weight: 650; white-space: nowrap; }
  #pageInfo {
    flex: 1; min-width: 0; font-size: 11px; color: var(--muted); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left;
  }
  .title-row button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .title-row button:hover { background: #f1f5f9; }
  .settings { display: none; gap: 8px; margin-top: 8px; flex-direction: column; }
  .settings.open { display: flex; }
  .settings label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 2px; }
  .settings input, .settings textarea {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 12.5px; font-family: inherit; background: var(--bg); color: var(--text);
  }
  .settings textarea { resize: vertical; min-height: 46px; font-size: 12px; }
  .key-row { display: flex; gap: 8px; }
  .key-row input { flex: 1; font-family: var(--mono); font-size: 12px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .hint code { background: #eef1f4; padding: 1px 4px; border-radius: 4px; }

  /* ---------- chat area ---------- */
  #chat {
    flex: 1 1 auto; overflow-y: auto; padding: 12px 10px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .mrow { display: flex; }
  .mrow.user { justify-content: flex-end; }
  .mrow.assistant { justify-content: flex-start; }
  .mrow.tool { justify-content: flex-start; padding-left: 18px; }
  .mrow.error { justify-content: center; }
  .mrow.typing { justify-content: flex-start; }

  .bubble {
    max-width: 85%; padding: 8px 12px; border-radius: 14px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; font-size: 13.5px;
    background: var(--panel); border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .mrow.user .bubble {
    background: var(--user-bg); border-color: var(--user-bg); color: var(--user-text);
    border-top-left-radius: 14px; border-top-right-radius: 4px;
  }
  .mrow.assistant .inner { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; max-width: 85%; }

  details.toolcall, details.toolresult {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: #eef1f4; border: 1px solid var(--border); border-radius: 8px;
    max-width: 95%; box-sizing: border-box; width: fit-content; min-width: 0;
  }
  details.toolcall > summary, details.toolresult > summary {
    padding: 3px 8px; cursor: pointer; user-select: none;
    word-break: break-all; list-style: none;
  }
  details.toolcall > summary::-webkit-details-marker,
  details.toolresult > summary::-webkit-details-marker { display: none; }
  details.toolcall > summary::before { content: '▸ '; }
  details.toolresult > summary::before { content: '▸ '; }
  details.toolcall[open] > summary::before,
  details.toolresult[open] > summary::before { content: '▾ '; }
  details.toolcall > summary:hover, details.toolresult > summary:hover { color: var(--text); }
  details.toolcall pre.raw, details.toolresult pre.raw {
    margin: 0; padding: 6px 8px; border-top: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word; font-size: 11px;
    max-height: 260px; overflow: auto; background: #fff; color: var(--text);
  }
  .mrow.tool .bubble, .mrow.error .bubble {
    background: transparent; border: none; color: var(--muted);
    font-family: var(--mono); font-size: 11.5px; padding: 2px 8px;
    max-width: 95%;
  }
  .mrow.error .bubble { color: var(--danger); font-family: inherit; background: #fdecec; border: 1px solid #f5c6c6; }
  .mrow.typing .bubble { background: #eceff3; border: none; color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% {opacity:.25} 40% {opacity:1} }

  /* ---------- composer ---------- */
  footer {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 8px 10px 10px; flex: 0 0 auto; display: flex; gap: 8px; align-items: flex-end;
  }
  #input {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font-size: 13.5px; font-family: inherit; outline: none;
    max-height: 140px; background: var(--bg); color: var(--text);
  }
  #input:focus { border-color: var(--accent); }
  #input:disabled { opacity: .6; }
  #sendBtn {
    border: none; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 8px 16px; font-size: 13.5px; cursor: pointer; font-weight: 600;
  }
  #sendBtn:hover { filter: brightness(1.08); }
  #sendBtn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="title-row">
      <h1>💬 Page Chat</h1>
      <span id="pageInfo" title=""></span>
      <button id="clearBtn" type="button">Clear</button>
      <button id="toggleSettings" type="button">Settings ▾</button>
    </div>
    <div class="settings" id="settings">
      <div>
        <label for="keyInput">OpenRouter API key</label>
        <div class="key-row">
          <input id="keyInput" type="password" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false">
          <button id="toggleKey" type="button" style="width:64px">Show</button>
        </div>
        <div class="hint">Stored in the extension's local storage, sent only to <code>openrouter.ai</code>. Get one at <code>openrouter.ai/keys</code>.</div>
      </div>
      <div>
        <label for="modelInput">Model</label>
        <input id="modelInput" list="models" placeholder="openrouter/auto" spellcheck="false">
        <datalist id="models">
          <option value="openrouter/auto">
          <option value="openai/gpt-4o-mini">
          <option value="openai/gpt-4o">
          <option value="anthropic/claude-3.5-sonnet">
          <option value="meta-llama/llama-3.3-70b-instruct">
          <option value="deepseek/deepseek-chat">
        </datalist>
      </div>
      <div>
        <label for="sysInput">System prompt <span style="text-transform:none;font-weight:400">(optional)</span></label>
        <textarea id="sysInput">You are a debugging assistant embedded in a browser DevTools panel, helping the user inspect and debug the web page they are looking at. You have three tools:
- "calculator": simple arithmetic. Prefer it for plain math.
- "execute_javascript": run JavaScript in an isolated sandbox with NO access to the page. Use for general computation (loops, arrays, JSON, statistics).
- "execute_in_page": run JavaScript inside the inspected page itself. Use for anything page-related: reading the DOM, computed styles, localStorage, page variables, etc. The code must complete synchronously; the value of the last expression is returned and must be JSON-serializable (stringify DOM nodes yourself, e.g. el.textContent or JSON.stringify(...)).
Prefer execute_in_page whenever the question concerns the page.</textarea>
      </div>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="Ask about the page, e.g. &quot;how many links are on this page?&quot;" autocomplete="off"></textarea>
    <button id="sendBtn" type="button">Send</button>
  </footer>

</div>

<script src="panel.js"></script>
</body>
</html>
